{
  "name": "${COMPOSE_PROJECT_NAME:?config/compose.env missing}",
  "services": {
    "db": {
      "image": "public.ecr.aws/docker/library/postgres:18.6-bookworm",
      "env_file": [
        "./config/database.env"
      ],
      "restart": "unless-stopped",
      "volumes": [
        "./data/postgres:/var/lib/postgresql:Z"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 20
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    },
    "migrate": {
      "image": "${APP_IMAGE:?release.env missing}",
      "env_file": [
        "./config/app.env"
      ],
      "init": true,
      "restart": "no",
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=128m"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "volumes": [
        "./data/uploads:/var/lib/starlit/uploads:z"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "command": [
        "node",
        "deploy/container/runtime.mjs",
        "migrate"
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        }
      }
    },
    "api": {
      "image": "${APP_IMAGE:?release.env missing}",
      "env_file": [
        "./config/app.env"
      ],
      "init": true,
      "restart": "unless-stopped",
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=128m"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "volumes": [
        "./data/uploads:/var/lib/starlit/uploads:z",
        "./data/verification:/var/lib/starlit/verification:z"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "ports": [
        "80:80",
        "443:443",
        "443:443/udp"
      ],
      "depends_on": {
        "db": {
          "condition": "service_healthy"
        },
        "migrate": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 24,
        "start_period": "20s"
      }
    },
    "gateway": {
      "image": "${GATEWAY_IMAGE:?release.env missing}",
      "network_mode": "service:api",
      "env_file": [
        "./config/gateway.env"
      ],
      "depends_on": {
        "api": {
          "condition": "service_healthy"
        }
      },
      "restart": "unless-stopped",
      "read_only": true,
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=32m"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "ALL"
      ],
      "cap_add": [
        "NET_BIND_SERVICE"
      ],
      "volumes": [
        "./data/caddy:/data:Z",
        "./data/caddy-config:/config:Z",
        "./data/verification:/verification:ro,z"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    }
  }
}
