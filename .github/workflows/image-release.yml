name: Build complete image deployment bundle
on:
  workflow_dispatch:
    inputs:
      version:
        description: New release version (without v)
        required: true
      notes:
        description: Release update summary (optional; generated changes are appended)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: image-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm
      - name: Check new version and build environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module -e "import {validateVersion} from './scripts/package-deploy.mjs'; validateVersion(process.env.RELEASE_VERSION)"
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then echo 'Release already exists'; exit 1; fi
          docker info
          docker compose version
          "$CHROME_PATH" --version
      - run: npm ci --no-audit --no-fund
      - name: Verify, build all images, smoke test and package
        run: npm run package:deploy -- --version="$RELEASE_VERSION" --images
      - name: Prepare release attachments
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          node --input-type=module <<'JS'
          import {readFile,copyFile,mkdir,writeFile} from 'node:fs/promises';
          import path from 'node:path';
          const v=process.env.RELEASE_VERSION;
          const record=JSON.parse(await readFile(`artifacts/releases/${v}.json`));
          await mkdir('artifacts/delivery');
          for(const file of [record.archive,record.archive+'.sha256'])await copyFile(file,path.join('artifacts/delivery',path.basename(file)));
          const bundle=record.archive.replace(/\.tar\.gz$/,'');
          await copyFile(path.join(bundle,'INSTALLATION.md'),'artifacts/delivery/IMAGES_INSTALLATION.md');
          const summary=(process.env.RELEASE_NOTES||'').trim();
          const notes=[summary,'完整 Linux amd64 Docker 镜像部署包。下载压缩包、同名 `.sha256` 文件及 `IMAGES_INSTALLATION.md`，按说明安装或升级。','安装脚本自动安装缺少的 Docker Engine 和 Compose。升级成功后清理本次上传包和新解压目录，保留运行数据及备份。','验收信息保存在包内 `RELEASE.json`；公网 HTTPS 和真实手机微信仍需实际服务器验证。','SHA256: `'+record.sha256+'`'].filter(Boolean).join('\n\n');
          await writeFile('artifacts/delivery/RELEASE_BODY.md',notes+'\n');
          JS
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" artifacts/delivery/*.tar.gz artifacts/delivery/*.sha256 artifacts/delivery/IMAGES_INSTALLATION.md --target "$GITHUB_SHA" --title "v$RELEASE_VERSION" --notes-file artifacts/delivery/RELEASE_BODY.md --generate-notes --prerelease
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-release-diagnostics
          path: |
            artifacts/release-check-*/verification.json
            artifacts/release-check-*/FAILED.txt
            artifacts/image-smoke.json
          if-no-files-found: ignore
